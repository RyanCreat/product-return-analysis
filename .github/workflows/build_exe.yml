name: 构建

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: 品退率分析工具-Windows
            filename: 品退率分析工具.exe
          - os: macos-latest
            artifact: 品退率分析工具-macOS
            filename: 品退率分析工具.app

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install openpyxl pyinstaller

      - name: 打包 Windows EXE
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --name "品退率分析工具" 品退率分析工具.py

      - name: 打包 macOS App
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile --windowed --name "品退率分析工具" 品退率分析工具.py

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.filename }}
          retention-days: 30
